[package]
name = "keyspot-native"
version = "0.1.0"
edition = "2021"
description = "KeySpot native sealed-memory core — HMAC, scan, zeroizing buffers, regex matching"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
napi = { version = "2", features = ["full", "napi8"] }
napi-derive = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
once_cell = "1"
regex = "1"

[profile.release]
lto = true
strip = true
opt-level = 3

[build-dependencies]
napi-build = "2"
